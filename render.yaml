# Render Blueprint: free Docker web service.
# No persistent disk. The image contains data/smd_parts.db and the process
# uses the default path ./data/smd_parts.db (WORKDIR /app). The container
# filesystem is ephemeral, so a restart or redeploy returns the baked-in
# 103 rows. seed/parts.json is never imported.
services:
  - type: web
    name: smd-parts-manager
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: SMD_DB
        value: ./data/smd_parts.db
      - key: SMD_OPEN_BROWSER
        value: "0"
